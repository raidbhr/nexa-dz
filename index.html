<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UFO Galaxy Projector | NEXA DZ</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0a1620;
    --teal: #123241;
    --cyan: #27e3ff;
    --blue: #0a6cff;
    --text: #f2f6ff;
    --mute: #a8bccb;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Tajawal', Arial, sans-serif;
    color: var(--text);
    line-height: 1.7;
    font-size: 16px;
    background: #2a1458 radial-gradient(ellipse at 20% 0, #6a2fd0 0, transparent 55%), radial-gradient(ellipse at 90% 100%, #1d6fa8 0, transparent 50%);
    min-height: 100vh;
}
.page {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 14px 16px calc(40px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, #0b1118 0, #10303a 45%, #0a1620 100%);
}
.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: max-content;
    margin: 0 auto 14px;
    background: #05090d;
    border-radius: 999px;
    padding: 5px 18px 5px 8px;
    font: 900 20px 'Tajawal', sans-serif;
    letter-spacing: 1px;
}
.logo i {
    font-style: normal;
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    font-size: 15px;
    box-shadow: 0 0 12px var(--cyan);
}
.hero {
    position: relative;
    border-radius: 14px 14px 0 0;
    overflow: hidden;
    background: #1a1040;
}
.hero img {
    display: block;
    width: 100%;
    aspect-ratio: 3/2;
    object-fit: cover;
}
.cta {
    display: block;
    text-align: center;
    background: var(--blue);
    color: #fff;
    text-decoration: none;
    font: 800 20px 'Tajawal', sans-serif;
    padding: 13px 10px;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 6px 22px rgba(10, 108, 255, .45);
}
.cta:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 3px solid var(--cyan);
    outline-offset: 2px;
}
h1 { font-size: 25px; font-weight: 900; line-height: 1.5; text-align: center; margin: 22px 0 4px; }
.sub { text-align: center; color: var(--mute); margin-bottom: 6px; }

.feats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 22px 0 8px;
    text-align: center;
}
.ring {
    width: 74px;
    height: 74px;
    margin: 0 auto 8px;
    border-radius: 50%;
    border: 2px solid var(--cyan);
    display: grid;
    place-items: center;
    font-size: 32px;
    background: radial-gradient(circle, #0e4b5c, #08222c);
    box-shadow: 0 0 16px rgba(39, 227, 255, .6), inset 0 0 14px rgba(39, 227, 255, .35);
}
.feats b { display: block; font-size: 15px; }
.feats span { display: block; font-size: 12.5px; color: var(--mute); line-height: 1.5; margin-top: 2px; }

.price { text-align: center; margin: 26px 0 4px; }
.price b { font-size: 44px; font-weight: 900; color: var(--cyan); text-shadow: 0 0 18px rgba(39, 227, 255, .5); }
.price span { color: var(--mute); }

form {
    border: 2px solid rgba(39, 227, 255, .55);
    border-radius: 18px;
    padding: 18px;
    background: rgba(8, 30, 40, .7);
    display: grid;
    gap: 11px;
    margin-top: 10px;
    box-shadow: 0 0 22px rgba(39, 227, 255, .15);
}
form h2 { margin: 0 0 4px; font-size: 20px; text-align: center; }

input, select {
    width: 100%;
    font: 500 17px 'Tajawal', sans-serif;
    background: #fff;
    color: #16222c;
    border: 0;
    border-radius: 10px;
    padding: 13px 14px;
}
button {
    width: 100%;
    border: 0;
    cursor: pointer;
    background: var(--blue);
    color: #fff;
    font: 800 19px 'Tajawal', sans-serif;
    padding: 14px;
    border-radius: 10px;
    transition: background 0.3s;
}
button:hover { background: #0056d6; }

footer { text-align: center; color: var(--mute); font-size: 13px; margin-top: 26px; }
</style>
</head>
<body>

<main class="page">

    <div class="logo"><i>NX</i>NEXA DZ</div>

    <div class="hero">
        <!-- استبدل "product-image.jpg" بمسار الصورة الحقيقي الخاص بك -->
        <img src="product-image.jpg" alt="UFO Galaxy Projector">
        <a href="#order-form" class="cta">اطلب الآن</a>
    </div>

    <h1>جهاز عرض المجرة UFO</h1>
    <p class="sub">حوّل غرفتك إلى فضاء ساحر بنقرة واحدة</p>

    <div class="feats">
        <div>
            <div class="ring">🌌</div>
            <b>عرض HD</b>
            <span>إضاءة عالية الدقة</span>
        </div>
        <div>
            <div class="ring">🎵</div>
            <b>مكبر صوت</b>
            <span>ربط بلوتوث سريع</span>
        </div>
        <div>
            <div class="ring">🎮</div>
            <b>تحكم عن بعد</b>
            <span>ريموت كنترولرفق</span>
        </div>
    </div>

    <div class="price">
        <b>4500</b> <span>د.ج</span>
    </div>

    <form id="order-form" action="#" method="POST">
        <h2>معلومات الطلب</h2>
        <input type="text" name="name" placeholder="الاسم الكامل" required aria-label="الاسم الكامل">
        <input type="tel" name="phone" placeholder="رقم الهاتف" required aria-label="رقم الهاتف">
        <select name="state" required aria-label="الولاية">
            <option value="">اختر الولاية</option>
            <option value="16">الجزائر</option>
            <option value="31">وهران</option>
            <option value="25">قسنطينة</option>
            <option value="06">بجاية</option>
            <option value="35">بومرداس</option>
            <!-- يمكنك إضافة باقي الولايات حسب الحاجة -->
        </select>
        <button type="submit">تأكيد الطلب الآن</button>
    </form>

    <footer>
        &copy; 2026 NEXA DZ. جميع الحقوق محفوظة.
    </footer>

</main>

</body>
</html>
